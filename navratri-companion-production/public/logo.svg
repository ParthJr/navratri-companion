<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#4a0e4e"/>
      <stop offset="100%" stop-color="#12001f"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9184a"/>
      <stop offset="50%" stop-color="#fd8a42"/>
      <stop offset="100%" stop-color="#ffdd00"/>
    </linearGradient>
    <linearGradient id="stick1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd8a42"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="stick2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="100%" stop-color="#fd8a42"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#fd8a42" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#ffb703" stroke-width="0.7" stroke-dasharray="2.5 1.5" stroke-opacity="0.6"/>

  <g transform="rotate(-30 32 34)" filter="url(#glow)">
    <rect x="30" y="10" width="4" height="42" rx="2" fill="url(#stick1Grad)"/>
    <rect x="30" y="15" width="4" height="2" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="20" width="4" height="2" fill="#c9184a"/>
    <rect x="30" y="25" width="4" height="2" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="44" width="4" height="6" rx="1" fill="#c9184a"/>
  </g>

  <g transform="rotate(30 32 34)" filter="url(#glow)">
    <rect x="30" y="10" width="4" height="42" rx="2" fill="url(#stick2Grad)"/>
    <rect x="30" y="15" width="4" height="2" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="20" width="4" height="2" fill="#311042"/>
    <rect x="30" y="25" width="4" height="2" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="44" width="4" height="6" rx="1" fill="#fd8a42"/>
  </g>

  <circle cx="32" cy="32" r="8" fill="#fd8a42" opacity="0.3" filter="url(#glow)"/>
  <path d="M 32 16 C 36 24, 39 28, 32 38 C 25 28, 28 24, 32 16 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="31" r="2.5" fill="#ffffff"/>

  <circle cx="16" cy="18" r="1.5" fill="#ffdd00" opacity="0.8"/>
  <circle cx="48" cy="18" r="1.5" fill="#ffdd00" opacity="0.8"/>
  <circle cx="14" cy="42" r="1" fill="#fd8a42" opacity="0.8"/>
  <circle cx="50" cy="42" r="1" fill="#fd8a42" opacity="0.8"/>
</svg>
